name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stt-linux-x86_64
          - os: macos-latest
            artifact: stt-macos-arm64
          - os: macos-13
            artifact: stt-macos-x86_64
          - os: windows-latest
            artifact: stt-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build standalone binary
        shell: bash
        run: |
          pyinstaller --onefile --name stt \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all tqdm \
            transcribe.py
          echo "Built: $(ls -lh dist/)"

      - name: Package binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "archive=${{ matrix.artifact }}.zip" >> "$GITHUB_ENV"
            mv dist/stt.exe stt.exe
            powershell Compress-Archive -Path stt.exe -DestinationPath "${{ matrix.artifact }}.zip"
            echo "Packaged: $(ls -lh ${{ matrix.artifact }}.zip)"
          else
            ARCHIVE="${{ matrix.artifact }}.tar.gz"
            tar -czf "$ARCHIVE" -C dist stt
            echo "Packaged: $(ls -lh "$ARCHIVE")"
            echo "archive=$ARCHIVE" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Show artifacts
        run: find . -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: stt-*/stt-*.*
          generate_release_notes: true
          draft: false
          prerelease: false
